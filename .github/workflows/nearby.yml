name: Google-free Nearby transfer
on:
  pull_request:
    paths:
      - 'app/src/**/nearby/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'app/gradle.lockfile'
      - 'scripts/verify-no-google-mobile-sdks.py'
      - '.github/workflows/nearby.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nearby-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RCLONE_ANDROID_TARGETS: android/amd64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/cache@v4
        id: rclone-cache
        with:
          path: app/libs/rclone-gomobile.aar
          key: ${{ runner.os }}-rclone-x86_64-${{ hashFiles('scripts/build-rclone-aar.sh', 'rclone-mobile/**') }}
      - if: steps.rclone-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-rclone-aar.sh
      - name: Save compiled emulator rclone library
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/libs/rclone-gomobile.aar
          key: ${{ runner.os }}-rclone-x86_64-${{ hashFiles('scripts/build-rclone-aar.sh', 'rclone-mobile/**') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space for native builds and emulator
        run: sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell
      - name: Build debug APK and Android tests
        run: ./gradlew -PwizefilesEmulatorAbi=x86_64 :app:verifyNoGoogleMobileSdks :app:assembleDebug :app:assembleDebugAndroidTest :app:testPureDebugUnitTest
      - name: Verify nearby persistence and checkpoint recovery
        run: ./gradlew -PwizefilesEmulatorAbi=x86_64 :app:testRobolectricDebugUnitTest --tests 'com.wisso.wizefiles.feature.nearby.NearbyTransferRecoveryTest' --tests 'com.wisso.wizefiles.feature.nearby.NearbySessionStoreTest'
      - name: Inspect debug APK
        run: python3 scripts/verify-no-google-mobile-sdks.py app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: ./gradlew -PwizefilesEmulatorAbi=x86_64 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.wisso.wizefiles.feature.nearby.NearbyLanRuntimeTest || { adb logcat -d -b crash; exit 1; }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: nearby-test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 14
      - uses: actions/upload-artifact@v5
        with:
          name: nearby-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/cache@v4
        id: rclone-cache
        with:
          path: app/libs/rclone-gomobile.aar
          key: ${{ runner.os }}-rclone-${{ hashFiles('scripts/build-rclone-aar.sh', 'rclone-mobile/**') }}
      - if: steps.rclone-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-rclone-aar.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space for native builds
        run: sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell
      - name: Build minified release with strict dependency verification
        run: ./gradlew :app:verifyNoGoogleMobileSdks :app:assembleRelease :app:lintVitalRelease
      - name: Inspect release APK
        run: python3 scripts/verify-no-google-mobile-sdks.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v5
        with:
          name: nearby-release-apk-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

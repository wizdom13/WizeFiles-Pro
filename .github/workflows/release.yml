name: Android Release

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow_run_name != '' && inputs.workflow_run_name || format('WizeFiles_{0}', github.ref_name) }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      workflow_run_name:
        description: "Custom workflow run name. Leave empty to use default."
        required: false
        default: ""
        type: string
      create_github_release:
        description: "Create GitHub Release"
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    environment: google-play-production

    permissions:
      contents: write

    env:
      WIZEFILES_LICENSE_API_BASE_URL: ${{ vars.WIZEFILES_LICENSE_API_BASE_URL }}
      WIZEFILES_LICENSE_KEY_ID: ${{ vars.WIZEFILES_LICENSE_KEY_ID }}
      WIZEFILES_LICENSE_PUBLIC_KEY_X509_BASE64: ${{ vars.WIZEFILES_LICENSE_PUBLIC_KEY_X509_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Read app version and release label
        shell: bash
        run: |
          set -euo pipefail

          APP_VERSION_CODE=$(sed -n "s/^def appVersionCode = \([0-9][0-9]*\)$/\1/p" app/build.gradle)
          APP_VERSION_NAME=$(sed -n "s/^def appVersionName = '\([^']*\)'$/\1/p" app/build.gradle)

          if [[ ! "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ || -z "$APP_VERSION_NAME" ]]; then
            echo "Could not read the hardcoded Android version from app/build.gradle" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            FILE_TAG="$GITHUB_REF_NAME"
          else
            FILE_TAG="v$APP_VERSION_NAME"
          fi

          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "FILE_TAG=$FILE_TAG" >> "$GITHUB_ENV"

          echo "Android version: $APP_VERSION_NAME ($APP_VERSION_CODE)"
          echo "Release label: $FILE_TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew scripts/verify-release-risk-gates.sh

      - name: Enforce P0 correctness release gates
        run: scripts/verify-release-risk-gates.sh

      - name: Validate production license configuration
        shell: bash
        run: |
          set -euo pipefail

          expected_url="https://wizefiles-license-api-uckg2rb5pq-ew.a.run.app"
          expected_key_id="wizefiles-prod-2026-01"
          expected_key_sha256="595f2fea65882e8d253133f28b83c5afabcddd392846a8640f8a3cf045dcf8e0"

          [[ "$WIZEFILES_LICENSE_API_BASE_URL" == "$expected_url" ]] || {
            echo "WIZEFILES_LICENSE_API_BASE_URL is missing or does not match production" >&2
            exit 1
          }
          [[ "$WIZEFILES_LICENSE_KEY_ID" == "$expected_key_id" ]] || {
            echo "WIZEFILES_LICENSE_KEY_ID is missing or does not match production" >&2
            exit 1
          }

          actual_key_sha256="$(
            printf '%s' "$WIZEFILES_LICENSE_PUBLIC_KEY_X509_BASE64" |
              base64 --decode |
              sha256sum |
              cut -d ' ' -f 1
          )"
          [[ "$actual_key_sha256" == "$expected_key_sha256" ]] || {
            echo "WIZEFILES_LICENSE_PUBLIC_KEY_X509_BASE64 is missing or has the wrong fingerprint" >&2
            exit 1
          }

      - name: Build Release APK
        run: ./gradlew assembleRelease --warning-mode all

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        env:
          BUILD_TOOLS_VERSION: "36.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.APP_KEYSTORE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename Signed APK
        id: rename_apk
        run: |
          set -euo pipefail

          RENAMED_APK="app/build/outputs/apk/release/WizeFiles_${FILE_TAG}.apk"

          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "$RENAMED_APK"

          echo "renamed_apk=$RENAMED_APK" >> "$GITHUB_OUTPUT"
          echo "SIGNED_RELEASE_FILE=$RENAMED_APK" >> "$GITHUB_ENV"

          ls -lh "$RENAMED_APK"    

      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v5
        with:
          name: WizeFiles_${{ env.FILE_TAG }}
          path: ${{ steps.rename_apk.outputs.renamed_apk }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release == true) }}
        with:
          name: WizeFiles_${{ env.FILE_TAG }}
          tag_name: ${{ env.FILE_TAG }}
          files: ${{ steps.rename_apk.outputs.renamed_apk }}
          generate_release_notes: true


name: Android UI Tests

on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'scripts/build-rclone-aar.sh'
      - 'rclone-mobile/**'
      - '.github/workflows/android-ui-tests.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2'

concurrency:
  group: android-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
            test-args: '-Pandroid.testInstrumentationRunnerArguments.notPackage=com.wisso.wizefiles.benchmark'
            lane: complete-api-30
          - api-level: 36
            test-args: '-Pandroid.testInstrumentationRunnerArguments.package=com.wisso.wizefiles.feature.filebrowser'
            lane: smoke-current-api
          - api-level: 36
            test-args: '-Pandroid.testInstrumentationRunnerArguments.package=com.wisso.wizefiles.security'
            lane: security-current-api
          - api-level: 36
            test-args: '-Pandroid.testInstrumentationRunnerArguments.package=com.wisso.wizefiles.provider'
            lane: provider-current-api

    steps:
    - name: Check out repository
      uses: actions/checkout@v5
      with:
        submodules: true

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Go 1.26.5
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.5'
        cache: false

    - name: Cache pinned rclone Android library
      id: rclone-cache
      uses: actions/cache@v4
      with:
        path: app/libs/rclone-gomobile.aar
        key: ${{ runner.os }}-rclone-${{ hashFiles('scripts/build-rclone-aar.sh', 'rclone-mobile/**') }}

    - name: Build pinned rclone Android library
      if: steps.rclone-cache.outputs.cache-hit != 'true'
      run: scripts/build-rclone-aar.sh

    - name: Set up Gradle cache
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: true

    - name: Free disk space for the Android emulator
      run: |
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/share/powershell
        df -h /

    - name: Enable KVM access
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Make build scripts executable
      run: chmod +x ./gradlew scripts/build-rclone-aar.sh

    - name: Run ${{ matrix.lane }} Android UI test lane
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        target: google_apis
        arch: x86_64
        disk-size: 2048M
        disable-animations: true
        emulator-options: >-
          -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          -camera-back none
        script: ./gradlew :app:connectedDebugAndroidTest ${{ matrix.test-args }} --warning-mode all

    - name: Upload instrumented test reports
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: android-ui-test-reports-${{ matrix.lane }}
        path: |
          app/build/reports/androidTests/**
          app/build/outputs/androidTest-results/**
        retention-days: 10

    - name: Upload instrumentation coverage
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: instrumentation-coverage-${{ matrix.lane }}
        path: |
          app/build/outputs/code_coverage/**
          app/build/reports/coverage/**
        if-no-files-found: warn
        retention-days: 14

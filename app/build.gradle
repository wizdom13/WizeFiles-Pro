apply plugin: 'com.android.application'
apply plugin: 'org.owasp.dependencycheck'
apply plugin: 'jacoco'

apply from: '../signing.gradle'

def appVersionCode = 700
def appVersionName = '0.7.0'
def betaValidityMillis = 30L * 24L * 60L * 60L * 1000L
def explicitBetaEpochMillis = System.getenv('BETA_BUILD_EPOCH_MILLIS')
def sourceDateEpochSeconds = System.getenv('SOURCE_DATE_EPOCH')
def gitCommitEpochSeconds = providers.exec {
    commandLine 'git', 'log', '-1', '--format=%ct'
}.standardOutput.asText.get().trim()
def betaBuildEpochMillis = explicitBetaEpochMillis != null \
    ? explicitBetaEpochMillis.toLong() \
    : (sourceDateEpochSeconds ?: gitCommitEpochSeconds).toLong() * 1000L
if (betaBuildEpochMillis < 0) {
    throw new GradleException('The beta build epoch must not be negative')
}
def betaExpiryEpochMillis = betaBuildEpochMillis + betaValidityMillis
def licenseKeyId = System.getenv('WIZEFILES_LICENSE_KEY_ID') ?: ''
def licensePublicKeyX509Base64 = System.getenv('WIZEFILES_LICENSE_PUBLIC_KEY_X509_BASE64') ?: ''
if (licenseKeyId.isEmpty() != licensePublicKeyX509Base64.isEmpty()) {
    throw new GradleException('Both WIZEFILES_LICENSE_KEY_ID and WIZEFILES_LICENSE_PUBLIC_KEY_X509_BASE64 must be set')
}
if (licenseKeyId && !(licenseKeyId ==~ /[A-Za-z0-9._-]{1,64}/)) {
    throw new GradleException('WIZEFILES_LICENSE_KEY_ID contains unsupported characters')
}
if (licensePublicKeyX509Base64 && !(licensePublicKeyX509Base64 ==~ /[A-Za-z0-9+\/=]+/)) {
    throw new GradleException('WIZEFILES_LICENSE_PUBLIC_KEY_X509_BASE64 is not standard Base64')
}
def licenseApiBaseUrl = System.getenv('WIZEFILES_LICENSE_API_BASE_URL') ?: ''
if (licenseApiBaseUrl) {
    def licenseApiUri = new URI(licenseApiBaseUrl)
    if (licenseApiUri.scheme != 'https' || !licenseApiUri.host || licenseApiUri.userInfo ||
        licenseApiUri.query || licenseApiUri.fragment) {
        throw new GradleException(
            'WIZEFILES_LICENSE_API_BASE_URL must be an HTTPS URL without credentials, query, or fragment'
        )
    }
    licenseApiBaseUrl = licenseApiBaseUrl.replaceAll('/+$', '')
}
if (licenseApiBaseUrl.isEmpty() != licenseKeyId.isEmpty()) {
    throw new GradleException(
        'WIZEFILES_LICENSE_API_BASE_URL and the license verification public key must be configured together'
    )
}

android {
    namespace = 'com.wisso.wizefiles'
    buildToolsVersion = '36.0.0'
    compileSdk = 36
    compileSdkExtension = 19
    ndkVersion = '29.0.14206865'
    defaultConfig {
        applicationId 'com.wisso.wizefiles'
        minSdk = 30
        // Not supporting foreground service timeout yet.
        //noinspection OldTargetApi
        targetSdk = 36
        versionCode appVersionCode
        versionName appVersionName
        resValue 'string', 'app_version', appVersionName + ' (' + appVersionCode + ')'
        buildConfigField 'String', 'FILE_PROVIDER_AUTHORITY', 'APPLICATION_ID + ".file_provider"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    buildFeatures {
        aidl = true
        buildConfig = true
        resValues = true
        viewBinding = true
    }
    androidResources {
        generateLocaleConfig = true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version = '3.22.1'
        }
    }
    lint {
        // For "Invalid package reference in library; 
        // not included in Android: javax.security.sasl.
        // Referenced from org.apache.mina.proxy.ProxyAuthException."
        warning 'InvalidPackage', 'MissingTranslation'
    }
    signingConfigs {
        debug {
            // Points to the file you just pasted in the app/ folder
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            signingConfig = signingConfigs.debug
            buildConfigField 'boolean', 'ENABLE_HIDDEN_API_BYPASS', 'true'
            buildConfigField 'boolean', 'ENABLE_ROOT_VERBOSE_LOGGING', 'true'
            testCoverageEnabled = true
        }
        release {
            minifyEnabled = true
            shrinkResources = false
            buildConfigField 'boolean', 'ENABLE_HIDDEN_API_BYPASS', 'false' 
            buildConfigField 'boolean', 'ENABLE_ROOT_VERBOSE_LOGGING', 'false'           
            buildConfigField 'String', 'LICENSE_KEY_ID', '"' + licenseKeyId + '"'
            buildConfigField 'String', 'LICENSE_PUBLIC_KEY_X509_BASE64', '"' + licensePublicKeyX509Base64 + '"'
            buildConfigField 'String', 'LICENSE_API_BASE_URL', groovy.json.JsonOutput.toJson(licenseApiBaseUrl)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        beta {
            initWith release
            applicationIdSuffix = ".beta"
            signingConfig = signingConfigs.release
            resValue 'string', 'app_name', 'WizeFiles Beta'
            buildConfigField 'long', 'BETA_EXPIRY_EPOCH_MILLIS', "${betaExpiryEpochMillis}L"
            matchingFallbacks = ['release']
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libc++_shared.so']
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'org/bouncycastle/pqc/crypto/picnic/*',
                'META-INF/**/*.version',       // The ** catches subfolders now
                'META-INF/**/*.properties',    // Catches app-metadata.properties
                'META-INF/**/*.textproto',     // Catches version-control-info
                'META-INF/**/LICENSE.txt',     // Catches the buried AndroidX licenses
                'META-INF/spring.*'            // Catches spring.handlers and spring.schemas
            ]
            // ACRA discovers the local report sender through Java's ServiceLoader.
            merges += ['META-INF/services/**']
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
}

kotlin {
    compilerOptions {
        freeCompilerArgs.add('-Xannotation-default-target=param-property')
    }
}

repositories {
    maven {
        url = 'https://jitpack.io'
    }
}
dependencyCheck {
    formats = ['HTML', 'JSON']
    failBuildOnCVSS = (rootProject.ext.dependency_check_fail_cvss as String).toFloat()
    autoUpdate = true
    failOnError = true
    skipTestGroups = true
    // Audit only dependency graphs that can ship to users. Build, lint, test, UTP,
    // and compiler tooling remain covered by their own update/CI maintenance path.
    scanConfigurations = ['releaseRuntimeClasspath', 'betaRuntimeClasspath']
    suppressionFile = "${rootProject.projectDir}/config/dependency-check-suppressions.xml"
    analyzers {
        assemblyEnabled = false
        // Sonatype Guide / OSS Index requires separate authentication. Keep the
        // blocking CI gate deterministic and NVD-backed until such credentials are configured.
        ossIndex {
            enabled = false
        }
    }
}

dependencies {
    implementation project(':core-files-api')
    implementation project(':feature-browser-domain')
    implementation project(':feature-transfer-domain')
    implementation project(':feature-vault-domain')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-parcelize-runtime:$kotlin_version"
    kotlinCompilerPluginClasspath "org.jetbrains.kotlin:kotlin-parcelize-compiler:$kotlin_version"

    implementation 'com.google.zxing:core:3.5.3'
    // readium-navigator 3.1.2 embeds PhotoView; declaring it again creates duplicate classes.
    implementation 'org.readium.kotlin-toolkit:readium-shared:3.1.2'
    implementation 'org.readium.kotlin-toolkit:readium-streamer:3.1.2'
    implementation 'org.readium.kotlin-toolkit:readium-navigator:3.1.2'
    implementation 'com.github.topjohnwu.libsu:service:5.2.2'

    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")

    def kotlinx_coroutines_version = '1.10.2'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinx_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinx_coroutines_version"

    // Play-distributed release builds only; beta/debug never launch real sales.
    releaseImplementation 'com.android.billingclient:billing:9.1.0'

    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.8'
    def androidx_lifecycle_version = '2.9.2'
    implementation "androidx.lifecycle:lifecycle-common-java8:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$androidx_lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$androidx_lifecycle_version"
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.pdf:pdf-viewer-fragment:1.0.0-alpha19'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.sqlite:sqlite-bundled:2.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'androidx.window:window:1.5.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Local, user-controlled crash capture. No HTTP sender is included.
    implementation 'ch.acra:acra-core:5.13.1'
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    def media3_version = '1.5.1'
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"

    // Stable LibVLC fallback for containers and codecs Media3 cannot decode.
    implementation 'org.videolan.android:libvlc-all:3.7.5'

    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation 'com.drakeet.drawer:drawer:1.0.3'
    implementation 'com.h6ah4i.android.materialshadowninepatch:materialshadowninepatch:1.0.0'
    implementation 'com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:1.0.0'
    // SMBJ 0.12.0 breaks anonymous authentication: https://github.com/hierynomus/smbj/issues/792
    //noinspection GradleDependency
    implementation ('com.hierynomus:smbj:0.11.5') {
        // org.bouncycastle:bcprov-jdk15on uses bytecode version unsupported by Jetifier, so use
        // org.bouncycastle:bcprov-jdk15to18 instead.
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
    // Android-compatible AOSP apksig port; SHA-256 is enforced by verify-apksig-dependency.sh.
    implementation 'com.github.MuntashirAkon:apksig-android:4.4.0'
    def bouncy_castle_version = '1.81'
    implementation "org.bouncycastle:bcprov-jdk15to18:$bouncy_castle_version"
    implementation ('com.hierynomus:sshj:0.40.0') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
    }
    implementation "org.bouncycastle:bcpkix-jdk15to18:$bouncy_castle_version"
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation 'org.connectbot:jbcrypt:1.0.2'
    implementation ('com.rapid7.client:dcerpc:0.12.13') {
        // SMBJ-RPC depends on the JRE flavor of Guava which targets Java 8.
        exclude group: 'com.google.guava', module: 'guava'
        // Prevent promotion of SMBJ version to 0.12.2.
        exclude group: 'com.hierynomus', module: 'smbj'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    // DCE/RPC still requests Commons Lang 3.4. Use a fixed runtime version for CVE-2025-48924.
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'com.google.guava:guava:33.4.8-android'
    // Guava conflicts with com.google.guava:listenablefuture:1.0 pulled in by AndroidX Core
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
    implementation 'com.takisoft.preferencex:preferencex:1.1.0'
    implementation 'commons-net:commons-net:3.12.0'
    // dev.chrisbanesinsetter:insetter:0.6.0 makes inset unstable when entering immersive.
    implementation 'dev.chrisbanes:insetter-ktx:0.3.1'
    implementation 'dev.rikka.rikkax.preference:simplemenu-preference:1.0.3'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation ('eu.agno3.jcifs:jcifs-ng:2.1.10') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    implementation platform('io.coil-kt:coil-bom:2.7.0')
    implementation 'io.coil-kt:coil'
    implementation 'io.coil-kt:coil-gif'
    implementation 'io.coil-kt:coil-svg'
    implementation 'io.coil-kt:coil-video'
    // Also a dependency of jCIFS-NG.
    implementation 'org.slf4j:slf4j-android:1.7.36'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlinx_coroutines_version"
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'androidx.test:core:1.6.1'
    testRuntimeOnly 'androidx.sqlite:sqlite-bundled-jvm:2.7.0'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.benchmark:benchmark-junit4:1.4.1'
}

tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    testLogging {
        events = ['failed']
        exceptionFormat = 'full'
        showCauses = true
        showExceptions = true
        showStackTraces = true
    }
}

afterEvaluate {
    def debugUnitTest = tasks.named('testDebugUnitTest', Test)
    def robolectricPatterns = fileTree('src/test').matching { include '**/*.kt', '**/*.java' }
        .findAll { file ->
            def source = file.getText('UTF-8')
            source.contains('org.robolectric') || source.contains('RobolectricTestRunner')
        }
        .collect { file ->
            def relative = project.file('src/test/java').toPath().relativize(file.toPath()).toString()
            relative.replace('\\', '/').replaceFirst(/\.(kt|java)$/, '.class')
        }
    def registerPartition = { String taskName, List<String> includes, List<String> excludes ->
        tasks.register(taskName, Test) {
            group = 'verification'
            description = "Runs the ${taskName.contains('Robolectric') ? 'Robolectric' : 'pure JVM'} debug tests."
            dependsOn debugUnitTest.get().taskDependencies.getDependencies(debugUnitTest.get())
            testClassesDirs = debugUnitTest.get().testClassesDirs
            classpath = debugUnitTest.get().classpath
            includes.each { include it }
            excludes.each { exclude it }
            jacoco.destinationFile = layout.buildDirectory.file("jacoco/${taskName}.exec").get().asFile
        }
    }
    registerPartition('testPureDebugUnitTest', ['**/*Test.class'], robolectricPatterns)
    registerPartition('testRobolectricDebugUnitTest', robolectricPatterns, [])

    tasks.register('jacocoPureDebugReport', JacocoReport) {
        dependsOn 'testPureDebugUnitTest'
        executionData layout.buildDirectory.file('jacoco/testPureDebugUnitTest.exec')
        sourceDirectories.from android.sourceSets.main.java.srcDirs
        classDirectories.from fileTree(layout.buildDirectory.dir('tmp/kotlin-classes/debug')) {
            exclude '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/*Binding.*'
        }
        reports { xml.required = true; html.required = true }
    }
    tasks.register('jacocoRobolectricDebugReport', JacocoReport) {
        dependsOn 'testRobolectricDebugUnitTest'
        executionData layout.buildDirectory.file('jacoco/testRobolectricDebugUnitTest.exec')
        sourceDirectories.from android.sourceSets.main.java.srcDirs
        classDirectories.from fileTree(layout.buildDirectory.dir('tmp/kotlin-classes/debug')) {
            exclude '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/*Binding.*'
        }
        reports { xml.required = true; html.required = true }
    }
}
